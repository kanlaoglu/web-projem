            </ul>
        </div>

<main class="container my-5">

    <header class="text-center mb-4">
        <h1 class="fw-bold">İletişim</h1>
        <p class="text-muted">Benimle iletişime geçmek için formu doldurabilirsiniz.</p>
    </header>

    <section class="p-4 bg-white shadow-sm rounded">
        <form action="form.php" method="POST" onsubmit="return formKontrol()">

            <div class="mb-3">
                <label class="form-label">Ad Soyad</label>
                <input type="text" name="adsoyad" id="adsoyad" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">E-posta</label>
                <input type="text" name="email" id="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Telefon</label>
                <input type="text" name="telefon" id="telefon" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Cinsiyet</label>
                <input type="radio" name="cinsiyet" value="Erkek"> Erkek
                <input type="radio" name="cinsiyet" value="Kadın" class="ms-3"> Kadın
            </div>

            <div class="mb-3">
                <label class="form-label d-block">İlgi Alanları</label>
                <input type="checkbox" name="ilgiler[]" value="Spor"> Spor
                <input type="checkbox" name="ilgiler[]" value="Oyun" class="ms-3"> Oyun
                <input type="checkbox" name="ilgiler[]" value="Gezi" class="ms-3"> Gezi
                <input type="checkbox" name="ilgiler[]" value="Film-Dizi" class="ms-3"> Film-Dizi
            </div>

            <div class="mb-3">
                <label class="form-label">Şehir</label>
                <select name="sehir" id="sehir" class="form-select">
                    <option value="">Şehir seçiniz</option>
                    <option value="İzmir">İzmir</option>
                    <option value="İstanbul">İstanbul</option>
                    <option value="Ankara">Ankara</option>
                    <option value="Sakarya">Sakarya</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Doğum Tarihi</label>
                <input type="date" name="dogumTarihi" id="dogumTarihi" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Mesaj</label>
                <textarea name="mesaj" id="mesaj" rows="5" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Gönder</button>
            <button type="reset" class="btn btn-secondary">Temizle</button>

        </form>
    </section>

</main>

<footer class="bg-dark text-white text-center py-3">
</footer>

<script src="js/validation.js"></script>
